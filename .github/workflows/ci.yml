name: CI

on:
  push:
    branches: [main, experimental]
  pull_request:
    branches: [main, experimental]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml

      # Package: typecheck + build (emits dist used by the recipe typecheck).
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

      # Site + recipes: typecheck recipes/landing against the shipped types,
      # and confirm the static landing builds.
      - run: pnpm --dir site install --frozen-lockfile
      - run: pnpm --dir site typecheck
      - run: pnpm --dir site build
